name: Release ZIP and Docker

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.2.3 or 1.3.0-rc.1 (a v prefix is optional)'
        required: true
        type: string
      docker:
        description: 'Also publish the Docker Hub image'
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Validate version and prevent replacement of an existing tag
        id: version
        env:
          VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo 'Run this workflow from the default branch.' >&2
            exit 1
          fi
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { releaseVersion } from './scripts/release-version.mjs';
          const release = releaseVersion(process.env.VERSION);
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${release.version}\ntag=${release.tag}\nprerelease=${release.prerelease}\n`);
          JS
          TAG="$(node --input-type=module -e "import { releaseVersion } from './scripts/release-version.mjs'; console.log(releaseVersion(process.env.VERSION).tag)")"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo 'This tag already exists. Choose a new version; releases are not overwritten.' >&2
            exit 1
          fi

      - name: Record the exact source commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild argon2 esbuild
          npm --prefix frontend ci --ignore-scripts
          npm --prefix frontend rebuild esbuild

      - name: Check and test
        run: |
          npm run test:security
          npm run security:check
          npm run audit
          npm run audit:frontend
          npm run lint
          npm test
          npm run test:frontend
          npm run test:release

      - name: Build backend and frontend
        run: npm run build

      - name: Package portable ZIP and SHA-256 checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm run release:zip -- "$VERSION"

      - name: Upload built artifacts for the isolated publisher
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archive
          path: |
            release/*.zip
            release/*.zip.sha256
          # noinspection UndefinedParamsPresent
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      tag: ${{ needs.build.outputs.tag }}
      commit: ${{ needs.build.outputs.commit }}
    steps:
      # No repository scripts, npm dependencies or archive contents run in this job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archive
          path: release
      - name: Verify the archive checksum
        working-directory: release
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          sha256sum "video-vault-$TAG.zip" | cmp - "video-vault-$TAG.zip.sha256"
      - name: Attest the built ZIP
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip
      - name: Create version tag and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          COMMIT: ${{ needs.build.outputs.commit }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          [[ "$COMMIT" =~ ^[a-f0-9]{40}$ ]] || exit 1
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$COMMIT" > /dev/null
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --target "$COMMIT" --title "VideoVault $TAG" --generate-notes)
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" "release/video-vault-$TAG.zip" "release/video-vault-$TAG.zip.sha256" "${args[@]}"

  # Releases created using GITHUB_TOKEN do not trigger another release-event workflow.
  # Call Docker explicitly so no extra GitHub PAT is needed.
  docker:
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs: release
    if: ${{ inputs.docker }}
    uses: ./.github/workflows/docker-release.yml
    with:
      # noinspection UndefinedParamsPresent
      tag: ${{ needs.release.outputs.tag }}
      ref: ${{ needs.release.outputs.commit }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
