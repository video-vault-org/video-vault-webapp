name: Release ZIP and Docker

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.2.3 or 1.3.0-rc.1 (a v prefix is optional)'
        required: true
        type: string
      docker:
        description: 'Also publish the Docker Hub image'
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Validate version and prevent replacement of an existing tag
        id: version
        env:
          VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo 'Run this workflow from the default branch.' >&2
            exit 1
          fi
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { releaseVersion } from './scripts/release-version.mjs';
          const release = releaseVersion(process.env.VERSION);
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${release.version}\ntag=${release.tag}\nprerelease=${release.prerelease}\n`);
          JS
          TAG="$(node --input-type=module -e "import { releaseVersion } from './scripts/release-version.mjs'; console.log(releaseVersion(process.env.VERSION).tag)")"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo 'This tag already exists. Choose a new version; releases are not overwritten.' >&2
            exit 1
          fi

      - name: Record the exact source commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Check and test
        run: |
          npm run lint
          npm test
          npm run test:frontend
          npm run test:release

      - name: Build backend and frontend
        run: npm run build

      - name: Package portable ZIP and SHA-256 checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm run release:zip -- "$VERSION"

      - name: Create version tag and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ steps.commit.outputs.sha }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --target "$COMMIT" --title "VideoVault $TAG" --generate-notes)
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" "release/video-vault-$TAG.zip" "release/video-vault-$TAG.zip.sha256" "${args[@]}"

  # Releases created using GITHUB_TOKEN do not trigger another release-event workflow.
  # Call Docker explicitly so no extra GitHub PAT is needed.
  docker:
    needs: release
    if: ${{ inputs.docker }}
    uses: ./.github/workflows/docker-release.yml
    with:
      # noinspection UndefinedParamsPresent
      tag: ${{ needs.release.outputs.tag }}
      ref: ${{ needs.release.outputs.commit }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
