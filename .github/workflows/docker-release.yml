name: Docker release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, e.g. v1.2.3'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      ref:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: publish-docker-image
  cancel-in-progress: false

jobs:
  docker:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Validate reviewed release source and image name
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const tag = process.env.RELEASE_TAG ?? '';
          const version = tag.slice(1);
          if (!tag.startsWith('v') || version.length > 127 || !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.test(version)) throw new Error('Invalid version tag');
          const prerelease = version.includes('-');
          if (prerelease && version.slice(version.indexOf('-') + 1).split('.').some(part => /^0\d+$/.test(part))) throw new Error('Invalid numeric prerelease identifier');
          const release = { tag, version, prerelease };
          if (release.tag !== process.env.RELEASE_TAG) throw new Error('The Git tag must start with v');
          if (!/^[a-z0-9][a-z0-9_-]*\/[a-z0-9]+(?:[._-][a-z0-9]+)*$/.test(process.env.IMAGE ?? '')) throw new Error('Set DOCKERHUB_IMAGE to namespace/repository in repository variables');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${release.version}\nprerelease=${release.prerelease}\n`);
          JS
          COMMIT="$(git rev-parse HEAD)"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$COMMIT" || { echo 'The checked-out source does not match the release tag.' >&2; exit 1; }
          git merge-base --is-ancestor "$COMMIT" "origin/$DEFAULT_BRANCH" || { echo 'Release source must belong to the default branch.' >&2; exit 1; }
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<TAGS'
            echo "$IMAGE:${RELEASE_TAG#v}"
            echo "$IMAGE:$RELEASE_TAG"
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push AMD64 and ARM64 images
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.tags }}
          labels: |
            org.opencontainers.image.title=VideoVault
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.commit }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=video-vault
          cache-to: type=gha,mode=max,scope=video-vault

      - name: Attest the published image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/${{ vars.DOCKERHUB_IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Advance latest only for the current stable GitHub Release
        if: ${{ steps.release.outputs.prerelease == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          LATEST="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)"
          if [ "$LATEST" = "$RELEASE_TAG" ]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          fi
