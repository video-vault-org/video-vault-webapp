services:
  app:
    image: ${VIDEO_VAULT_IMAGE:-video-vault:local}
    build: .
    init: true
    restart: unless-stopped
    ports:
      - '127.0.0.1:${VIDEO_VAULT_HTTP_PORT:-3210}:3210'
    volumes:
      - video-vault-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s

volumes:
  video-vault-data:
